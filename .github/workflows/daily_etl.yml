name: Daily Mixpanel to Tableau ETL

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the generated Hyper file to Tableau Cloud'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mixpanel-tableau-etl
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[tableau,gcs]"

      - name: Run pipeline
        id: pipeline
        env:
          MIXPANEL_API_SECRET: ${{ secrets.MIXPANEL_API_SECRET }}
          MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
          MIXPANEL_TIMEZONE: ${{ vars.MIXPANEL_TIMEZONE || 'UTC' }}
          TABLEAU_SERVER_URL: ${{ secrets.TABLEAU_SERVER_URL }}
          TABLEAU_SITE_ID: ${{ secrets.TABLEAU_SITE_ID }}
          TABLEAU_TOKEN_NAME: ${{ secrets.TABLEAU_TOKEN_NAME }}
          TABLEAU_TOKEN_VALUE: ${{ secrets.TABLEAU_TOKEN_VALUE }}
          TABLEAU_PROJECT_NAME: ${{ vars.TABLEAU_PROJECT_NAME || 'Default' }}
          TABLEAU_DATASOURCE_NAME: ${{ vars.TABLEAU_DATASOURCE_NAME || 'mixpanel_hyper' }}
          PUBLISH_TO_TABLEAU: ${{ inputs.publish || vars.PUBLISH_TO_TABLEAU == 'true' }}
        run: |
          args=(--yesterday --verbose --output ./output/events.hyper)
          if [ "$PUBLISH_TO_TABLEAU" = "true" ]; then
            args+=(--publish)
          fi
          python main.py "${args[@]}"
          echo "published=$PUBLISH_TO_TABLEAU" >> "$GITHUB_OUTPUT"

      - name: Upload Hyper extract
        if: steps.pipeline.outputs.published != 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mixpanel-events-${{ github.run_id }}
          path: output/events.hyper
          if-no-files-found: error
          retention-days: 7
