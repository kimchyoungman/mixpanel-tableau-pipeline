name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[tableau,gcs,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=src --cov=config --cov-report=term-missing

      - name: CLI smoke test
        env:
          MIXPANEL_API_SECRET: test-secret
          MIXPANEL_PROJECT_ID: test-project
        run: |
          python main.py --help
          python main.py --check-config
