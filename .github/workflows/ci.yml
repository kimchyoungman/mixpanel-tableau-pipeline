name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[tableau,gcs,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=src --cov=config --cov-report=term-missing

      - name: CLI smoke test
        env:
          MIXPANEL_API_SECRET: test-secret
          MIXPANEL_PROJECT_ID: test-project
        run: |
          python main.py --help
          python main.py --check-config
