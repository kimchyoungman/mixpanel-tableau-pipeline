name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[tableau,gcs,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=src --cov=config --cov-report=term-missing

      - name: CLI smoke test
        env:
          MIXPANEL_API_SECRET: test-secret
          MIXPANEL_PROJECT_ID: test-project
        run: |
          python main.py --help
          python main.py --check-config
