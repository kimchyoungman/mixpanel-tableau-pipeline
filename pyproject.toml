[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mixpanel-tableau-pipeline"
version = "0.1.0"
description = "Export Mixpanel events to Tableau Hyper extracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mixpanel-tableau-pipeline contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "python-dotenv>=1.0,<2",
  "pytz>=2023.3",
  "requests>=2.31,<3",
  "tableauhyperapi>=0.0.17000",
]

[project.optional-dependencies]
tableau = ["tableauserverclient>=0.25,<1"]
gcs = ["google-cloud-storage>=2.10,<4"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
mixpanel-tableau = "main:main"

[project.urls]
Homepage = "https://github.com/kimchyoungman/mixpanel-tableau-pipeline"
Issues = "https://github.com/kimchyoungman/mixpanel-tableau-pipeline/issues"
Source = "https://github.com/kimchyoungman/mixpanel-tableau-pipeline"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config", "src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
